[package]
name = "leo-agents"
version = "0.2.1"
edition = "2021"
description = "一切皆插件的可商用 Rust Agent 底座：插件内核 + 通用 Agent Loop + 开箱即用的 leo 命令行"
license = "Apache-2.0"

[lib]
name = "leo_agents"
path = "src/lib.rs"

[[bin]]
name = "leo"
path = "src/cli/main.rs"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
regex = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
ureq = { version = "2", features = ["tls"] }

[profile.release]
opt-level = 2